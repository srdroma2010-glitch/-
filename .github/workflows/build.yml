name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev python3-pip

      - name: Install Buildozer 1.4.0
        run: |
          pip install --upgrade pip
          pip install "cython<3.0"
          pip install buildozer==1.4.0

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Show last 100 lines if failed
        if: failure()
        run: tail -n 100 build.log

      - name: Find APK
        if: always()
        run: |
          echo "===== Searching for APK everywhere ====="
          find . -name "*.apk" -type f 2>/dev/null | head -50
          echo "===== Done ====="

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-apk
          path: |
            bin/*.apk
            .buildozer/**/bin/*.apk
            .buildozer/**/*.apk
            **/*.apk
          if-no-files-found: warn
